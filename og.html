<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<title>FUTURO · portada OG</title>
<!-- Fuente de assets/og.jpg (1200×630). Regenerar: ver landing/README.md -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600&family=Syne:wght@800&display=block">
<style>
  :root{--bg:#FBFBF8;--ink:#111827;--muted:#5B6270;--accent:#2F5BFF;--mark:#FFD23F;--sky:#7FA6FF;--lila:#B9A8FF}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg)}
  .c{position:relative;width:1200px;height:630px;overflow:hidden;font-family:Manrope,sans-serif;color:var(--ink)}
  .aura{position:absolute;right:-180px;top:-160px;width:760px;height:760px;filter:blur(70px);opacity:.6;
    background:radial-gradient(circle at 40% 40%,var(--accent) 0 18%,transparent 46%),radial-gradient(circle at 64% 58%,var(--sky) 0 20%,transparent 52%),radial-gradient(circle at 42% 78%,var(--lila) 0 16%,transparent 46%),radial-gradient(circle at 76% 26%,var(--mark) 0 9%,transparent 30%)}
  .glass{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 30px,rgba(255,255,255,.36) 30px 31px,rgba(255,255,255,.1) 31px 60px);
    -webkit-mask-image:linear-gradient(90deg,transparent 48%,#000 78%);mask-image:linear-gradient(90deg,transparent 48%,#000 78%)}
  .in{position:absolute;left:80px;top:72px;right:80px;bottom:64px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{font:800 34px/1 Syne,sans-serif;letter-spacing:.01em;display:inline-grid;gap:8px;justify-self:start;width:max-content}
  .logo i{display:block;height:6px;background:var(--mark)}
  .label{font:600 18px/1 Manrope;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
  .label b{color:var(--accent);font-weight:600}
  h1{margin:0;font:800 76px/.98 Syne,sans-serif;letter-spacing:-.025em;max-width:860px}
  .u{background:linear-gradient(transparent 62%,var(--mark) 62%,var(--mark) 90%,transparent 90%)}
</style>
</head>
<body>
<div class="c">
  <div class="aura"></div><div class="glass"></div>
  <div class="in">
    <div class="logo">FUTURO<i></i></div>
    <div>
      <p class="label"><b>Gratis</b> · Orientación vocacional para prepa</p>
      <h1>Te enseñamos <span class="u">quién</span> puedes llegar a ser.</h1>
    </div>
  </div>
</div>
</body>
</html>
